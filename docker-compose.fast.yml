# Shadowgain fast-deploy override. Layers on top of docker-compose.yml and only
# changes WHERE the server image comes from - build from pre-published output
# (Dockerfile.fast) instead of compiling from source on the droplet.
#
# Everything else - db, env, ports, volumes - is inherited unchanged, EXCEPT the
# server's restart policy; see below.
#
#   docker compose -f docker-compose.yml -f docker-compose.fast.yml up -d --build
#
# Note this file also carries the localhost-only MySQL binding. The stock
# docker-compose.yml publishes 3306 on 0.0.0.0, and Docker's DNAT bypasses UFW,
# which would expose MySQL to the internet on a public host. Kept here so the fast
# path is safe standalone; docker-compose.override.yml does the same for the
# stock path.
services:
  ace-db:
    ports: !override
      - "127.0.0.1:3306:3306/tcp"

  ace-server:
    build:
      context: .
      dockerfile: Dockerfile.fast

    # Shadowgain: survive an unattended reboot.
    #
    # Upstream sets `on-failure` for ace-server. That restarts a container that CRASHES,
    # but it does NOT start one when the Docker daemon comes up after a host reboot - so
    # a droplet restart left the database running and the game server DOWN until someone
    # logged in and ran compose by hand. Found exactly that way during the 025 resize,
    # where the stack had to be started manually after the power cycle.
    #
    # `unless-stopped` fixes the boot case while preserving the behaviour deploys rely
    # on: a container we deliberately `docker compose stop` stays stopped, so the
    # graceful-shutdown path is unaffected. ace-db already uses this.
    #
    # No added crash-loop risk - upstream's on-failure already had unlimited retries.
    restart: unless-stopped
